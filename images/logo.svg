<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50" role="img" aria-label="LearnAble Logo">
  <defs>
    <linearGradient id="logoEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="sparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4338ca" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (40x40) -->
  <g transform="translate(4, 5)" filter="url(#badgeGlow)">
    <rect width="40" height="40" rx="10" fill="url(#logoEmblemGrad)" />
    <!-- Stylized Book 'L' -->
    <path d="M 12 10 C 12 8.5, 14 8, 15 9 L 19 12.5 L 19 29.5 C 16 28, 12 28.5, 11 30 L 10 29 L 10 12 C 10 11, 11 10, 12 10 Z" fill="#ffffff" />
    <path d="M 10 27 C 12 27, 17 28.5, 20 30 L 29 30 C 30 30, 30.5 29, 29 28 C 26 26.5, 21 25.5, 18 25 L 11 25 C 10 25, 10 26, 10 27 Z" fill="#e0e7ff" />
    <path d="M 21 12.5 L 26.5 9 C 27.5 8.2, 29 8.6, 29 10 L 29 27 C 29 28, 28 28.5, 27 28 C 24 26.8, 21 27.5, 21 29.5 Z" fill="#ffffff" opacity="0.95" />
    <path d="M 20 5.5 L 21.2 8.5 L 24 9.5 L 21.2 10.5 L 20 13.5 L 18.8 10.5 L 16 9.5 L 18.8 8.5 Z" fill="url(#sparkGold)" />
  </g>

  <!-- Typography: LearnAble -->
  <text x="56" y="27" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5px">Learn<tspan fill="url(#textGrad)">Able</tspan></text>

  <!-- Small Vibrant Dot Accent -->
  <circle cx="166" cy="18" r="3" fill="#ec4899" />

  <!-- Subtitle Tagline -->
  <text x="56" y="40" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#64748b" letter-spacing="0.8px">LEARNING DISABILITY SUPPORT</text>
</svg>
