<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="LearnAble Logo Emblem">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- White Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Spark Gold Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#312e81" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Emblem Base -->
  <rect width="48" height="48" rx="12" fill="url(#logoBadgeGrad)" filter="url(#logoShadow)" />

  <!-- Subtle Inner Shimmer Border -->
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.25" />

  <!-- The Open Book forming stylized 'L' + Growth Wings -->
  <!-- Left Page (Bold Letter L curve) -->
  <path d="M 14 12 C 14 10.5, 16 10, 17.5 11 L 23 15 L 23 35.5 C 19 33.5, 14 34, 13 36 C 12.5 36.5, 12 36, 12 35 L 12 14 C 12 13, 13 12, 14 12 Z" fill="url(#pageGrad)" />

  <!-- Horizontal Base Foot of 'L' -->
  <path d="M 12 32 C 15 32, 21 33.5, 24 35.5 L 34 35.5 C 35.5 35.5, 36 34, 34.5 33 C 31 31, 25 30, 22 29.5 L 13 29.5 C 12 29.5, 12 30.5, 12 32 Z" fill="#e0e7ff" />

  <!-- Right Page (Uplifting Wing of Learning) -->
  <path d="M 25 15 L 31.5 11 C 33 10, 35 10.5, 35 12 L 35 32 C 35 33.2, 33.8 34, 32.5 33.5 C 29 32, 25.5 33, 25 35.5 Z" fill="#ffffff" opacity="0.95" />

  <!-- Central Heart & Spark of Empowerment -->
  <!-- Glowing Spark above book spine -->
  <path d="M 24 7 L 25.5 10.5 L 29 12 L 25.5 13.5 L 24 17 L 22.5 13.5 L 19 12 L 22.5 10.5 Z" fill="url(#sparkGrad)" />

  <!-- Small accent dots -->
  <circle cx="15" cy="8" r="1.5" fill="#fde047" opacity="0.85" />
  <circle cx="33" cy="8" r="1.5" fill="#fbcfe8" opacity="0.85" />
</svg>
